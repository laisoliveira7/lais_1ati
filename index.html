<!-- 
// Copilot, crie a estrutura base de um site HTML5.
// Copilot, por que você usou uma tag '<section>' aqui?
// R: A tag <section> é usada para agrupar conteúdo relacionado tematicamente.
// Ela ajuda na semântica do HTML5, tornando o código mais organizado e
// melhorando a acessibilidade do site.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicPlayer</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Barra lateral -->
        <aside class="sidebar">
            <div class="logo">
                <h2>MusicPlayer</h2>
            </div>
            <nav>
                <ul>
                    <li class="active"><i class="fas fa-home"></i> Início</li>
                    <li><i class="fas fa-search"></i> Buscar</li>
                    <li><i class="fas fa-list"></i> Playlists</li>
                    <li><i class="fas fa-heart"></i> Favoritos</li>
                </ul>
            </nav>
        </aside>

        <!-- Conteúdo principal -->
        <main class="main-content">
            <!-- Player fixo no topo -->
            <div class="now-playing">
                <div class="current-song">
                    <img src="https://picsum.photos/50/50?random=1" alt="Capa atual" class="current-thumb">
                    <div class="song-info">
                        <h3>Selecione uma música</h3>
                        <p>Clique em uma música para começar</p>
                    </div>
                </div>
                <div class="player-controls">
                    <button class="control-btn"><i class="fas fa-backward"></i></button>
                    <button class="control-btn play-pause"><i class="fas fa-play"></i></button>
                    <button class="control-btn"><i class="fas fa-forward"></i></button>
                </div>
            </div>

            <!-- Seção de destaque -->
            <section class="featured">
                <h2>Músicas Populares</h2>
                <div id="lista-de-musicas" class="music-grid">
                    <!-- Os cards de música serão inseridos aqui pelo JavaScript -->
                </div>
            </section>
        </main>
    </div>
</body>
</html>
