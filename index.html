// Copilot, crie a estrutura base de um site HTML5.
// Copilot, por que você usou uma tag '<section>' aqui?
// R: A tag <section> é usada para agrupar conteúdo relacionado tematicamente.
// Ela ajuda na semântica do HTML5, tornando o código mais organizado e
// melhorando a acessibilidade do site.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Músicas Favoritas - Spotify Integration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Minhas Músicas Favoritas</h1>
        <div id="user-profile">
            <!-- Informações do usuário do Spotify serão inseridas aqui -->
        </div>
        <div id="login-container">
            <button id="login-button" class="spotify-button">Conectar ao Spotify</button>
        </div>
    </header>

    <main>
        <div class="controls">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Buscar música ou artista...">
                <button id="search-button" class="spotify-button">Buscar</button>
            </div>
            <div class="filters">
                <button class="filter-button active" data-type="tracks">Músicas</button>
                <button class="filter-button" data-type="playlists">Playlists</button>
            </div>
        </div>

        <section id="lista-de-musicas">
            <!-- Os cards de música serão inseridos aqui pelo JavaScript -->
        </section>

        <div id="player-container">
            <div class="now-playing">
                <img id="current-track-image" src="placeholder.png" alt="Capa do álbum">
                <div class="track-info">
                    <h3 id="current-track-name">Nenhuma música selecionada</h3>
                    <p id="current-track-artist">Selecione uma música para começar</p>
                </div>
            </div>
            <div class="player-controls">
                <button id="previous-button">⏮</button>
                <button id="play-pause-button">▶</button>
                <button id="next-button">⏭</button>
            </div>
        </div>
    </main>

    <footer>
        <p>Desenvolvido com 💜 usando a API do Spotify</p>
    </footer>

    <!-- Scripts -->
    <script src="spotify-config.js"></script>
    <script src="spotify-auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
