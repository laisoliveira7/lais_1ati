<!-- 
// Copilot, crie a estrutura base de um site HTML5.
// Copilot, por que você usou uma tag '<section>' aqui?
// R: A tag <section> é usada para agrupar conteúdo relacionado tematicamente.
// Ela ajuda na semântica do HTML5, tornando o código mais organizado e
// melhorando a acessibilidade do site.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Músicas Favoritas</title>
    <!-- Link para o CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--
    // Copilot, por que você usou uma tag <section> aqui?
    // R: A tag <section> é um elemento semântico do HTML5 que representa uma 
    // seção independente de conteúdo relacionado. Neste caso, ela agrupa todos
    // os cards de música, tornando o código mais organizado e melhorando a
    // acessibilidade do site para leitores de tela.
    -->
    <header>
        <h1>Minhas Músicas Favoritas</h1>
    </header>

    <main>
        <section id="lista-de-musicas">
            <!-- Os cards de música serão inseridos aqui pelo JavaScript -->
        </section>
    </main>

    <footer>
        <p>Desenvolvido com 💜</p>
    </footer>

    <!-- Script JS -->
    <script src="app.js"></script>
</body>
</html>
